<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cargar servicios pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Inter', sans-serif; background: #F4F5F0; color: #101820;
    padding: 24px 16px 60px; min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: #6B7680; font-size: 13px; margin: 0 0 24px; }
  .card { background: #FFFFFF; border: 1px solid #D8DCD4; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-size: 12px; color: #6B7680; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; font-family: 'IBM Plex Mono', monospace; }
  input[type="password"], input[type="file"], select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1.5px solid #D8DCD4;
    font-size: 14px; font-family: inherit; background: #FFFFFF; margin-bottom: 14px;
  }
  button {
    width: 100%; padding: 13px; border: none; border-radius: 8px; background: #101820;
    color: #F5A623; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px;
    cursor: pointer;
  }
  button:disabled { background: #C7CCC3; color: #8A9089; cursor: wait; }
  .status { font-size: 13px; margin-top: 10px; min-height: 18px; }
  .status.ok { color: #2E7D32; }
  .status.err { color: #C0392B; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #EEE; }
  th { color: #6B7680; font-weight: 500; }
  .hidden { display: none; }
  .field-row { display: flex; gap: 10px; }
  .field-row > div { flex: 1; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginCard" class="card">
    <h1>Cargar servicios pendientes</h1>
    <p class="subtitle">Acceso restringido — solo personal de oficina.</p>
    <label for="pw">Contraseña</label>
    <input type="password" id="pw" placeholder="Contraseña">
    <button id="pwBtn" type="button">Ingresar</button>
    <p class="status err" id="pwError"></p>
  </div>

  <div id="mainCard" class="hidden">
    <h1>Cargar servicios pendientes</h1>
    <p class="subtitle">Subí el CSV que exporta el ERP. Se reemplaza el listado completo que ve la app.</p>

    <div class="card">
      <label for="csvFile">Archivo CSV</label>
      <input type="file" id="csvFile" accept=".csv,.txt">
      <p class="status" id="parseStatus"></p>
    </div>

    <div class="card hidden" id="mappingCard">
      <label>Asigná qué columna del CSV corresponde a cada dato</label>
      <div class="field-row">
        <div>
          <label>N° de servicio</label>
          <select id="mapNumero"></select>
        </div>
        <div>
          <label>Cliente</label>
          <select id="mapCliente"></select>
        </div>
      </div>
      <div class="field-row">
        <div>
          <label>Dirección</label>
          <select id="mapDireccion"></select>
        </div>
        <div>
          <label>Localidad (opcional)</label>
          <select id="mapLocalidad"></select>
        </div>
      </div>
      <label>Tarea a realizar</label>
      <select id="mapTarea"></select>

      <p class="subtitle" style="margin-top:14px;">Vista previa (primeras filas):</p>
      <table id="previewTable"><thead></thead><tbody></tbody></table>
    </div>

    <button id="uploadBtn" type="button" class="hidden">Subir servicios a la app</button>
    <p class="status" id="uploadStatus"></p>
  </div>

</div>

<script>
// ==== CONFIGURACIÓN — completar antes de publicar ====
// Contraseña para entrar a esta página (distinta de la de los técnicos).
const ADMIN_PASSWORD = "TU_CONTRASEÑA_DE_OFICINA";
// Misma clave secreta que SERVICIOS_API_TOKEN en app.js y en Vercel.
const SERVICIOS_API_TOKEN = "TU_CLAVE_SECRETA_COMPARTIDA";
// =======================================================

const MAP_KEY = "servicios_admin_column_map";
let parsedRows = [];
let headers = [];

const pw = document.getElementById("pw");
const pwBtn = document.getElementById("pwBtn");
const pwError = document.getElementById("pwError");
const loginCard = document.getElementById("loginCard");
const mainCard = document.getElementById("mainCard");
const csvFile = document.getElementById("csvFile");
const parseStatus = document.getElementById("parseStatus");
const mappingCard = document.getElementById("mappingCard");
const uploadBtn = document.getElementById("uploadBtn");
const uploadStatus = document.getElementById("uploadStatus");
const previewTable = document.getElementById("previewTable");

const mapSelects = {
  numero_servicio: document.getElementById("mapNumero"),
  cliente: document.getElementById("mapCliente"),
  direccion: document.getElementById("mapDireccion"),
  localidad: document.getElementById("mapLocalidad"),
  tarea: document.getElementById("mapTarea"),
};

pwBtn.addEventListener("click", () => {
  if (pw.value === ADMIN_PASSWORD) {
    loginCard.classList.add("hidden");
    mainCard.classList.remove("hidden");
  } else {
    pwError.textContent = "Contraseña incorrecta.";
  }
});
pw.addEventListener("keydown", (e) => { if (e.key === "Enter") pwBtn.click(); });

csvFile.addEventListener("change", () => {
  const file = csvFile.files[0];
  if (!file) return;
  parseStatus.textContent = "Leyendo archivo...";
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      parsedRows = results.data;
      headers = results.meta.fields || [];
      if (headers.length === 0 || parsedRows.length === 0) {
        parseStatus.textContent = "No se encontraron filas o columnas en el archivo.";
        mappingCard.classList.add("hidden");
        uploadBtn.classList.add("hidden");
        return;
      }
      parseStatus.textContent = `Se leyeron ${parsedRows.length} filas.`;
      setupMapping();
      mappingCard.classList.remove("hidden");
      uploadBtn.classList.remove("hidden");
    },
    error: () => {
      parseStatus.textContent = "No se pudo leer el archivo. ¿Es un CSV válido?";
    },
  });
});

function setupMapping() {
  const savedMap = JSON.parse(localStorage.getItem(MAP_KEY) || "{}");
  Object.entries(mapSelects).forEach(([field, select]) => {
    select.innerHTML = "";
    if (field === "localidad") {
      const emptyOpt = document.createElement("option");
      emptyOpt.value = "";
      emptyOpt.textContent = "(sin usar)";
      select.appendChild(emptyOpt);
    }
    headers.forEach((h) => {
      const opt = document.createElement("option");
      opt.value = h;
      opt.textContent = h;
      select.appendChild(opt);
    });
    if (savedMap[field] && headers.includes(savedMap[field])) {
      select.value = savedMap[field];
    } else {
      // intento de auto-detección por nombre parecido
      const guess = headers.find((h) => h.toLowerCase().includes(field.split("_")[0]));
      if (guess) select.value = guess;
    }
    select.addEventListener("change", renderPreview);
  });
  renderPreview();
}

function currentMapping() {
  const map = {};
  Object.entries(mapSelects).forEach(([field, select]) => { map[field] = select.value; });
  return map;
}

function renderPreview() {
  const map = currentMapping();
  localStorage.setItem(MAP_KEY, JSON.stringify(map));

  const cols = ["numero_servicio", "cliente", "direccion", "localidad", "tarea"];
  previewTable.querySelector("thead").innerHTML =
    "<tr>" + cols.map((c) => `<th>${c}</th>`).join("") + "</tr>";

  const rows = parsedRows.slice(0, 5).map((row) => {
    const mapped = cols.map((c) => (map[c] ? (row[map[c]] ?? "") : ""));
    return "<tr>" + mapped.map((v) => `<td>${v}</td>`).join("") + "</tr>";
  });
  previewTable.querySelector("tbody").innerHTML = rows.join("");
}

uploadBtn.addEventListener("click", async () => {
  const map = currentMapping();
  if (!map.numero_servicio || !map.cliente || !map.direccion || !map.tarea) {
    uploadStatus.className = "status err";
    uploadStatus.textContent = "Falta asignar alguna columna obligatoria.";
    return;
  }

  const servicios = parsedRows.map((row) => {
    const item = {
      numero_servicio: String(row[map.numero_servicio] ?? "").trim(),
      cliente: String(row[map.cliente] ?? "").trim(),
      direccion: String(row[map.direccion] ?? "").trim(),
      tarea: String(row[map.tarea] ?? "").trim(),
    };
    if (map.localidad) item.localidad = String(row[map.localidad] ?? "").trim();
    return item;
  }).filter((item) => item.numero_servicio || item.cliente);

  uploadBtn.disabled = true;
  uploadStatus.className = "status";
  uploadStatus.textContent = "Subiendo...";

  try {
    const res = await fetch("/api/servicios", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + SERVICIOS_API_TOKEN,
      },
      body: JSON.stringify(servicios),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Error desconocido");
    uploadStatus.className = "status ok";
    uploadStatus.textContent = `Listo — se subieron ${data.count} servicios. Ya están disponibles en la app.`;
  } catch (err) {
    uploadStatus.className = "status err";
    uploadStatus.textContent = "No se pudo subir: " + err.message;
  } finally {
    uploadBtn.disabled = false;
  }
});
</script>
</body>
</html>
