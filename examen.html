<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#26252B">
<title>Examen técnico · SAT</title>
<link rel="icon" href="/icons/logo.png">
<link rel="stylesheet" href="/vendor/fonts.css">
<style>
  :root {
    --head: #26252B; --paper: #F5F3EE; --card: #FFFFFF; --line: #E4E0D6; --text: #16151A; --text-2: #4C4A44; --muted: #6B6860;
    --amber: #F6B828; --amber-soft: #FFF3D1; --amber-dark: #7A5300; --ok: #0F6E63; --ok-soft: #E2F1EE; --err: #B3261E; --err-soft: #FFF3F2;
    --r: 14px; --sh: 0 1px 2px rgba(13,12,13,.05), 0 10px 30px -12px rgba(13,12,13,.16); --ring: 0 0 0 3px rgba(246,184,40,.45);
    --cond: 'Barlow Semi Condensed', 'Barlow', sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Barlow', -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.45; background: var(--paper); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: none; box-shadow: var(--ring); }
  .barra { background: var(--head); color: #fff; position: sticky; top: 0; z-index: 5; }
  .barra-in { max-width: 760px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
  .barra img { height: 30px; }
  .barra .sec { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; color: #A9A69C; }
  .reloj { margin-left: auto; font-family: var(--cond); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; padding: 2px 12px; border-radius: 999px; background: rgba(255,255,255,.08); }
  .reloj.poco { background: var(--err); }
  .avance { height: 4px; background: rgba(255,255,255,.12); } .avance i { display: block; height: 100%; background: var(--amber); transition: width .3s; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); padding: 20px; }
  h1 { font-family: var(--cond); font-size: 28px; line-height: 1.1; margin: 0 0 6px; }
  h2 { font-family: var(--cond); font-size: 20px; margin: 18px 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .reglas { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text-2); }
  .reglas b { color: var(--text); }
  .alerta { background: var(--amber-soft); border: 1px solid #F2D58A; color: var(--amber-dark); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin: 14px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
  .chip { background: #F0EEE8; border-radius: 999px; padding: 4px 12px; font-size: 14px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 14px 22px; font-weight: 700; font-size: 17px; cursor: pointer; background: var(--amber); color: #1A1400; min-height: 52px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sec { background: #fff; border: 1px solid var(--line); color: var(--text-2); font-weight: 600; }
  .acciones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .acciones .btn { flex: 1; min-width: 150px; }
  .tema { font-family: var(--cond); font-weight: 600; font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--amber-dark); }
  .preg { font-size: 19px; font-weight: 600; margin: 6px 0 16px; user-select: none; -webkit-user-select: none; white-space: pre-wrap; }
  .ops { display: grid; gap: 10px; }
  .op { text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 14px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-size: 16px; user-select: none; -webkit-user-select: none; }
  .op .l { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; color: var(--muted); }
  .op.on { border-color: var(--head); background: #F7F6F2; } .op.on .l { background: var(--head); border-color: var(--head); color: #fff; }
  textarea { width: 100%; min-height: 170px; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; resize: vertical; background: #FAFAF7; color: var(--text); }
  textarea:focus { border-color: var(--head); outline: none; }
  .num { font-size: 14px; color: var(--muted); }
  .grande { font-family: var(--cond); font-size: 56px; font-weight: 700; line-height: 1; margin: 10px 0 4px; }
  .temas { display: grid; gap: 10px; margin-top: 14px; }
  .tfila { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .tbar { grid-column: 1 / -1; height: 8px; background: #ECEAE4; border-radius: 4px; overflow: hidden; } .tbar i { display: block; height: 100%; background: var(--head); }
  .error { background: var(--err-soft); color: var(--err); border-radius: 12px; padding: 12px 14px; margin-top: 12px; font-size: 15px; }
  .centro { text-align: center; }
  .icono { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; background: var(--ok-soft); color: var(--ok); }
  .icono.warn { background: var(--amber-soft); color: var(--amber-dark); }
  .oculto { display: none !important; }
</style>
</head>
<body>
<header class="barra">
  <div class="barra-in"><img src="/icons/logo.png" alt="SAT"><span class="sec">Examen técnico</span><span class="reloj oculto" id="reloj">--:--</span></div>
  <div class="avance oculto" id="avance"><i style="width:0"></i></div>
</header>
<main id="app"><div class="card"><p class="muted">Cargando…</p></div></main>

<script>
(function () {
  const API = "/api/datos?publico=examen";
  const token = new URLSearchParams(location.search).get("t") || "";
  const app = document.getElementById("app"), reloj = document.getElementById("reloj"), avance = document.getElementById("avance");
  const pc = (n) => String(n).replace(".", ",") + " %";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  let estado = null, venceLocal = 0, tic = null, enviando = false, elegida = null, salida = false;

  async function pedir(cuerpo) {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ t: token, ...cuerpo }), cache: "no-store" });
    const d = await r.json().catch(() => ({ error: "Sin respuesta del servidor" }));
    if (!r.ok && !d.estado) throw new Error(d.error || "Error " + r.status);
    return d;
  }
  function mostrarError(msj) { app.innerHTML = `<div class="card"><h1>No se puede abrir el examen</h1><div class="error">${esc(msj)}</div><p class="muted">Si creés que es un error, avisale a la oficina.</p></div>`; }

  // ---------- Si sale de la página, el examen se cierra ----------
  function avisarSalida(motivo) {
    if (!estado || estado.estado !== "en_curso" || salida) return;
    salida = true;
    const datos = JSON.stringify({ t: token, accion: "salir", motivo });
    try { if (!navigator.sendBeacon || !navigator.sendBeacon(API, datos)) throw 0; }
    catch (e) { fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: datos, keepalive: true }).catch(() => {}); }
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") avisarSalida("cambio de pantalla");
    else if (salida) setTimeout(() => cargar(false), 800);
  });
  window.addEventListener("pagehide", () => avisarSalida("cerró la página"));
  window.addEventListener("beforeunload", (e) => { if (estado && estado.estado === "en_curso" && !salida) { e.preventDefault(); e.returnValue = ""; } });

  async function cargar(primera) {
    if (!/^[A-Za-z0-9_-]{20,40}$/.test(token)) { mostrarError("Este link no es válido. Abrí el link completo que te mandó la oficina."); return; }
    try {
      // Abrir de nuevo un examen ya empezado (recargar, volver a entrar) cuenta como salir.
      estado = await pedir({ accion: "estado", reabre: !!primera });
      pintar();
    } catch (e) { mostrarError(e.message); }
  }

  function pintar() {
    clearInterval(tic);
    reloj.classList.add("oculto"); avance.classList.add("oculto");
    if (estado.estado === "pendiente") return pintarInicio();
    if (estado.estado === "en_curso") return pintarPregunta();
    if (estado.estado === "terminado") return pintarFin();
    mostrarError("Este link ya no está disponible. Pedile uno nuevo a la oficina.");
  }

  function pintarInicio() {
    const temas = Object.entries(estado.por_temario || {}).map(([t, n]) => `<span class="chip">${esc(t)}: ${n} preguntas · ${esc((estado.niveles || {})[t] || "")}</span>`).join("");
    app.innerHTML = `<div class="card">
      <h1>Hola, ${esc(estado.tecnico)}</h1>
      <p class="muted">Examen técnico de SAT: alarmas, cámaras y redes.</p>
      <div class="chips">${temas}</div>
      <h2>Antes de empezar</h2>
      <ul class="reglas">
        <li>Son <b>${estado.total} preguntas</b> y tenés <b>${estado.minutos} minutos</b> en total. El reloj arranca cuando tocás «Empezar».</li>
        <li>Van <b>de a una</b> y no se puede volver atrás. Si no sabés una, tocá «No sé, pasar».</li>
        <li>Hay preguntas de opción múltiple (una sola correcta) y algunas para responder con tus palabras: explicá qué revisás o qué hacés, como se lo contarías a un compañero.</li>
        <li>Las difíciles valen más. Lo que no respondas no suma.</li>
      </ul>
      <div class="alerta"><b>Una vez que empezás no podés salir de esta página.</b> Si cambiás de app, atendés una llamada, cerrás o recargás la página, el examen <b>se termina y se corrige como esté</b>. Poné el celular en «No molestar» y buscá un lugar tranquilo.</div>
      <div class="acciones"><button type="button" class="btn" id="empezar">Empezar el examen</button></div>
    </div>`;
    document.getElementById("empezar").onclick = async (ev) => {
      ev.target.disabled = true;
      try { estado = await pedir({ accion: "empezar" }); salida = false; pintar(); }
      catch (e) { ev.target.disabled = false; mostrarError(e.message); }
    };
  }

  function arrancarReloj() {
    venceLocal = Date.now() + (estado.restante_ms || 0);
    reloj.classList.remove("oculto");
    const pintarReloj = () => {
      const ms = Math.max(0, venceLocal - Date.now());
      const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
      reloj.textContent = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      reloj.classList.toggle("poco", ms < 3 * 60000);
      if (ms <= 0) { clearInterval(tic); finTiempo(); }
    };
    pintarReloj();
    tic = setInterval(pintarReloj, 500);
  }
  async function finTiempo() {
    // Se manda lo que tenía escrito o marcado y se cierra.
    try { const r = respuestaActual(); if (r !== null) estado = await pedir({ accion: "responder", i: estado.actual, r }); } catch (e) { /* nada */ }
    try { estado = await pedir({ accion: "fin_tiempo" }); } catch (e) { /* nada */ }
    pintar();
  }
  function respuestaActual() {
    const q = estado && estado.pregunta; if (!q) return null;
    if (q.tipo === "mc") return elegida;
    const ta = document.getElementById("resp"); return ta && ta.value.trim() ? ta.value.trim() : null;
  }

  function pintarPregunta() {
    const q = estado.pregunta;
    if (!q) { cargar(false); return; }
    elegida = null;
    avance.classList.remove("oculto");
    avance.firstElementChild.style.width = Math.round((estado.actual / estado.total) * 100) + "%";
    const letra = (i) => String.fromCharCode(65 + i);
    app.innerHTML = `<div class="card">
      <div style="display:flex;justify-content:space-between;gap:10px"><span class="tema">${esc(q.temario)}</span><span class="num">Pregunta ${estado.actual + 1} de ${estado.total}</span></div>
      <p class="preg">${esc(q.texto)}</p>
      ${q.tipo === "mc"
        ? `<div class="ops">${q.opciones.map((o, i) => `<button type="button" class="op" data-i="${i}"><span class="l">${letra(i)}</span><span>${esc(o)}</span></button>`).join("")}</div>`
        : `<textarea id="resp" maxlength="2000" placeholder="Escribí tu respuesta…" autocomplete="off" spellcheck="true"></textarea><p class="num">Respuesta abierta: contá los pasos o los puntos clave.</p>`}
      <div class="acciones"><button type="button" class="btn sec" id="pasar">No sé, pasar</button><button type="button" class="btn" id="seguir" ${q.tipo === "mc" ? "disabled" : ""}>${estado.actual + 1 === estado.total ? "Responder y terminar" : "Responder y seguir"}</button></div>
      <div id="err"></div>
    </div>`;
    const seguir = document.getElementById("seguir");
    app.querySelectorAll(".op").forEach((b) => b.onclick = () => {
      elegida = Number(b.dataset.i);
      app.querySelectorAll(".op").forEach((x) => x.classList.toggle("on", x === b));
      seguir.disabled = false;
    });
    const ta = document.getElementById("resp");
    if (ta) { ta.addEventListener("paste", (e) => e.preventDefault()); ta.focus(); }
    const enviar = async (r) => {
      if (enviando) return;
      enviando = true; seguir.disabled = true; document.getElementById("pasar").disabled = true;
      try { estado = await pedir({ accion: "responder", i: estado.actual, r }); pintar(); window.scrollTo({ top: 0 }); }
      catch (e) { document.getElementById("err").innerHTML = `<div class="error">${esc(e.message)}. Probá de nuevo.</div>`; seguir.disabled = false; document.getElementById("pasar").disabled = false; }
      enviando = false;
    };
    seguir.onclick = () => {
      const r = respuestaActual();
      if (r === null) { document.getElementById("err").innerHTML = `<div class="error">Escribí tu respuesta o tocá «No sé, pasar».</div>`; return; }
      enviar(r);
    };
    document.getElementById("pasar").onclick = () => enviar(null);
    arrancarReloj();
  }

  function pintarFin() {
    const motivo = { completo: "Respondiste todas las preguntas.", tiempo: "Se terminó el tiempo.", salio: "Saliste de la página, así que el examen se cerró y se corrigió como estaba.", cerrado_oficina: "La oficina cerró el examen." }[estado.motivo_fin] || "";
    const temas = Object.entries(estado.por_temario || {}).map(([t, p]) => `<div class="tfila"><b>${esc(t)}</b><span>${pc(p.porcentaje)} <span class="muted">(${p.respondidas}/${p.total})</span></span><div class="tbar"><i style="width:${p.porcentaje}%"></i></div></div>`).join("");
    app.innerHTML = `<div class="card centro">
      <div class="icono ${estado.motivo_fin === "completo" ? "" : "warn"}"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${estado.motivo_fin === "completo" ? '<path d="M5 12l5 5L20 7"/>' : '<path d="M12 8v5M12 16.5v.01"/><circle cx="12" cy="12" r="9"/>'}</svg></div>
      <h1>Examen terminado</h1>
      <p class="muted">${esc(motivo)}</p>
      <div class="grande">${pc(estado.porcentaje)}</div>
      <p class="muted">${estado.puntaje} de ${estado.maximo} puntos · respondiste ${estado.respondidas} de ${estado.total}</p>
      <div class="temas" style="text-align:left">${temas}</div>
      <p class="muted" style="margin-top:18px">Las respuestas abiertas las revisa la oficina y el puntaje final puede cambiar un poco. Ya podés cerrar esta página.</p>
    </div>`;
  }

  cargar(true);
})();
</script>
</body>
</html>
