<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía rápida de tu alarma Paradox — SAT</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #121114; --head: #26252B; --paper: #F5F3EE; --card: #fff;
    --text: #16151A; --text-2: #4A4842; --muted: #6B6860; --line: #E4E0D6; --line-2: #ECE9E1;
    --amber: #F6B828; --amber-dark: #7A5300; --amber-soft: #FFF3D1;
    --ok: #0F6E63; --ok-soft: #E2F1EE; --rojo: #B42318; --rojo-soft: #FDE7E4; --azul: #2348C8; --azul-soft: #E4ECFF;
    --cond: 'Barlow Semi Condensed', 'Barlow', sans-serif; --mono: 'IBM Plex Mono', monospace;
    --sh: 0 1px 2px rgba(18,17,20,.05), 0 12px 28px -18px rgba(18,17,20,.4);
    --hex: polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0 50%);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Barlow', system-ui, sans-serif; background: var(--paper); color: var(--text); font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .barra { background: var(--head); color: #fff; }
  .barra-in { max-width: 1100px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; gap: 12px; }
  .barra img { height: 28px; } .barra .sep { width: 1px; height: 20px; background: #4A4950; }
  .barra .sec { font-family: var(--cond); font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; font-size: 12.5px; color: #B9B6AC; }
  .hero { background: var(--head); color: #fff; padding: 8px 18px 70px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; right: -80px; top: -80px; width: 320px; height: 320px; background: radial-gradient(circle, rgba(246,184,40,.2), rgba(246,184,40,0) 70%); }
  .hero-in { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  .eyebrow { font-family: var(--cond); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; font-size: 13px; color: var(--amber); }
  .hero h1 { font-family: var(--cond); font-weight: 800; font-style: italic; text-transform: uppercase; font-size: clamp(32px, 7vw, 46px); line-height: .96; margin: 8px 0 10px; }
  .hero h1 em { color: var(--amber); }
  .hero p { margin: 0; color: #C9C6BC; max-width: 560px; }
  .selector { display: inline-flex; margin-top: 18px; background: rgba(255,255,255,.08); border-radius: 999px; padding: 4px; gap: 4px; }
  .selector button { border: 0; background: none; color: #D9D6CC; padding: 9px 16px; border-radius: 999px; font-weight: 700; font-size: 14.5px; }
  .selector button.on { background: var(--amber); color: var(--ink); }
  .selector.marca { margin: 0 0 14px; display: flex; width: max-content; }
  .selector.marca button { font-family: var(--cond); font-size: 16px; letter-spacing: .6px; padding: 7px 20px; }
  .selector.marca button.on { background: #fff; }
  .rkz .tecla, .pk .tecla { transition: transform .08s; transform-box: fill-box; }
  .rkz .tecla.apretada, .pk .tecla.apretada { transform: translateY(2.2px); }
  .rkz .tecla.apretada .cara, .pk .tecla.apretada .cara { filter: brightness(.86); }
  .rkz .tecla.sostener .aro, .pk .tecla.sostener .cara { stroke: #F6B828; stroke-width: 3; }
  .rled.v { fill: #2BD15A; filter: drop-shadow(0 0 3px #2BD15A); } .rled.r { fill: #FF3B42; filter: drop-shadow(0 0 3px #FF3B42); } .rled.a { fill: #F6B828; filter: drop-shadow(0 0 3px #F6B828); }
  .rled.tit, .pkst.tit, .pkw.tit { animation: parpadeo .6s steps(1) infinite; }
  #pkOk.on { stroke: #2BD15A; } #pkLock.on { fill: #E53940; } #pkLock.on path { stroke: #E53940; } #pkTri.on { fill: #F0A81E; } #pkCA.on circle, #pkCA.on path { stroke: #2C9A3A; }
  .pkw { opacity: .1; transition: opacity .2s; } .pkw.on { opacity: 1; }
  .cmb .tecla.apretada .cara, .ts .tecla.apretada .cara { fill: #F6B828; fill-opacity: .28; }
  .ts .tecla.apretada .cara[fill="#2BD15A"], .ts .tecla.apretada .cara[fill="#C72B33"], .ts .tecla.apretada .cara[fill="#F6B828"] { filter: brightness(1.25); }
  .pk .tecla.apretada .cara { filter: brightness(.86); }
  .cled { transition: fill .2s; } .cind.on .cled { fill: #2BD15A; filter: drop-shadow(0 0 3px #2BD15A); } #cmbFallo.on .cled { fill: #FF3B42; filter: drop-shadow(0 0 3px #FF3B42); }
  #cmbMarco.alarma { stroke-width: 4; filter: drop-shadow(0 0 8px #FF3B42); animation: parpadeo .5s steps(1) infinite; }
  #cmbLector.on { color: #2BB24C; }
  .tsscr { display: none; } .tsscr.on { display: inline; }
  #tsLogo { color: #8D939B; transition: color .2s; } #tsLogo.on { color: #E53940; filter: drop-shadow(0 0 5px rgba(229,57,64,.7)); }
  .tsdot.on { fill: #1E2228; stroke: #1E2228; }
  .seg { fill: #173F17; } .seg.off { fill: #173F17; opacity: .08; }

  .cuerpo { max-width: 1100px; margin: -48px auto 0; padding: 0 14px 40px; display: grid; gap: 16px; position: relative; z-index: 2; }
  @media (min-width: 900px) { .cuerpo { grid-template-columns: 420px 1fr; align-items: start; } .visor { position: sticky; top: 14px; } }

  /* ---------- visor con el teclado ---------- */
  .visor { background: #1C1B20; border-radius: 24px; padding: 18px 18px 16px; box-shadow: 0 30px 60px -28px rgba(0,0,0,.7); color: #fff; }
  .visor-tit { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .visor-tit b { font-family: var(--cond); font-size: 20px; }
  .visor-tit small { color: #9C998F; font-size: 12.5px; }
  .teclado { width: 100%; max-width: 330px; margin: 0 auto; background: linear-gradient(180deg, #F2F1EE, #DEDCD6); border-radius: 22px; padding: 16px 16px 18px; box-shadow: inset 0 1px 0 #fff, 0 18px 30px -16px rgba(0,0,0,.7); position: relative; }
  .tk-marca { text-align: center; font-family: var(--cond); font-weight: 700; letter-spacing: 3px; font-size: 11px; color: #77746C; margin-bottom: 10px; }
  .lcd { background: #9DB58A; border-radius: 8px; height: 62px; padding: 8px 12px; font-family: var(--mono); font-size: 14px; line-height: 1.35; color: #1D2A17; box-shadow: inset 0 2px 6px rgba(0,0,0,.35); margin-bottom: 12px; white-space: pre; overflow: hidden; position: relative; }
  .lcd.luz { background: #B9D69F; }
  .leds { display: flex; justify-content: center; gap: 18px; margin-bottom: 14px; }
  .led { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 700; color: #6B6860; letter-spacing: .4px; }
  .led i { width: 12px; height: 12px; border-radius: 50%; background: #BDB9AF; box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
  .led.verde.on i { background: #2BD15A; box-shadow: 0 0 10px #2BD15A; }
  .led.rojo.on i { background: #FF3B42; box-shadow: 0 0 10px #FF3B42; }
  .led.amb.on i { background: #F6B828; box-shadow: 0 0 10px #F6B828; }
  .led.tit i { animation: titila .5s steps(1) infinite; }
  @keyframes titila { 50% { background: #BDB9AF; box-shadow: none; } }
  .teclas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 8px repeat(2, minmax(0, 1fr)); gap: 8px; }
  .tecla[data-k=CLEAR], .tecla[data-k=ENTER] { font-size: 10.5px; letter-spacing: 0; }
  .tecla { position: relative; height: 40px; border-radius: 10px; border: 0; background: linear-gradient(180deg, #FFFFFF, #E9E7E1); box-shadow: 0 3px 0 #B9B5AB, 0 4px 8px -2px rgba(0,0,0,.25); font-family: var(--cond); font-weight: 700; font-size: 17px; color: #26252B; display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }
  .tecla.fn { font-size: 11px; letter-spacing: .5px; background: linear-gradient(180deg, #3B3A42, #26252B); color: #fff; box-shadow: 0 3px 0 #0E0D10, 0 4px 8px -2px rgba(0,0,0,.35); }
  .tecla .zled { position: absolute; top: 5px; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: transparent; }
  .k10 .tecla .zled { background: #D3CFC5; }
  .teclado:not(.k10) .tecla:not(.fn) .zled { display: none; }
  .tecla .zled.on { background: #FF3B42; box-shadow: 0 0 7px #FF3B42; }
  .tecla .zled.flash { background: #FF3B42; box-shadow: 0 0 7px #FF3B42; animation: titila .45s steps(1) infinite; }
  .tecla.fn .zled.on, .tecla.fn .zled.flash { background: #F6B828; box-shadow: 0 0 7px #F6B828; }
  .tecla.apretada { transform: translateY(3px); box-shadow: 0 0 0 #B9B5AB, 0 0 0 transparent; }
  .tecla.fn.apretada { box-shadow: 0 0 0 #0E0D10; }
  .tecla.marca::after { content: ""; position: absolute; inset: -5px; border-radius: 13px; border: 3px solid var(--amber); animation: marca 1s ease-out infinite; }
  @keyframes marca { 0% { opacity: 1; transform: scale(.94); } 100% { opacity: 0; transform: scale(1.12); } }
  .tecla.sostener::after { content: ""; position: absolute; inset: -5px; border-radius: 13px; border: 3px solid var(--amber); }
  .tecla .prog { width: 16px; height: 12px; border: 2px solid #fff; border-radius: 3px; position: relative; }
  .tecla .prog::after { content: ""; position: absolute; left: 2px; right: 2px; top: 3px; height: 2px; background: #fff; box-shadow: 0 3px 0 #fff; }
  .hueco { visibility: hidden; }
  .tk-wrap { position: relative; max-width: 330px; margin: 0 auto; }
  #tecLCD svg, #tecK10 svg, #tecRKZ svg, #tecPK svg, #tecTS svg, #tecCMB svg { width: 100%; height: auto; display: block; }
  .k10h .tecla { transition: transform .08s; transform-box: fill-box; }
  .k10h .tecla.apretada { transform: translateY(2.4px); }
  .k10h .tecla.apretada .cara { fill: #CFD0CB; }
  .k10h .tecla.sostener .cara { stroke: #F6B828; stroke-width: 2.6; }
  .k10h .tecla.z-on .cara, .k10h .tecla.z-flash .cara { fill: url(#hRojo); stroke: #E0283C; }
  .k10h .tecla.z-on .halo, .k10h .tecla.z-flash .halo { opacity: 1; }
  .k10h .tecla.z-on .et, .k10h .tecla.z-flash .et { fill: #fff; }
  .k10h .tecla.z-on .brillo, .k10h .tecla.z-flash .brillo { opacity: .25; }
  .k10h .tecla.z-flash .cara, .k10h .tecla.z-flash .halo { animation: parpadeo .5s steps(1) infinite; }
  .k10h .tecla.f-on .verde, .k10h .tecla.f-flash .verde { opacity: 1; }
  .k10h .tecla.f-flash .verde { animation: parpadeo .5s steps(1) infinite; }
  @keyframes parpadeo { 50% { opacity: .2; } }
  .hled { transition: fill .2s; }
  .hled.rojo { fill: #FF3B42; filter: drop-shadow(0 0 3px #FF3B42); }
  .hled.verdeL { fill: #2BD15A; filter: drop-shadow(0 0 3px #2BD15A); }
  .hled.tit { animation: parpadeo .6s steps(1) infinite; }
  .k32 .tecla { transition: transform .08s; transform-box: fill-box; }
  .k32 .tecla.apretada { transform: translateY(2.2px); }
  .k32 .tecla.apretada .cara { fill: #ADA690; }
  .k32 .tecla.sostener .cara { stroke: #F6B828; stroke-width: 2.4; }
  .kled-ca { animation: none; }
  .dedo { position: absolute; width: 34px; height: 34px; border-radius: 50%; background: rgba(246,184,40,.45); border: 2px solid var(--amber); pointer-events: none; opacity: 0; transition: left .35s cubic-bezier(.2,.8,.2,1), top .35s cubic-bezier(.2,.8,.2,1), opacity .2s; z-index: 3; }
  .bip { position: absolute; right: -6px; top: -12px; background: var(--ok); color: #fff; font-weight: 700; font-size: 12.5px; border-radius: 999px; padding: 4px 10px; opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s; }
  .bip.on { opacity: 1; transform: none; } .bip.mal { background: var(--rojo); }
  .subt { margin: 16px 0 0; min-height: 64px; background: rgba(255,255,255,.06); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; }
  .subt .n { width: 30px; height: 30px; clip-path: var(--hex); background: var(--amber); color: var(--ink); display: grid; place-items: center; font-family: var(--cond); font-weight: 800; flex: none; }
  .subt p { margin: 0; font-size: 15px; }
  .controles { display: flex; gap: 8px; margin-top: 12px; }
  .controles button { flex: 1; border: 1px solid #3A3940; background: none; color: #D9D6CC; border-radius: 12px; padding: 9px; font-weight: 600; font-size: 14px; }
  .controles button.prim { background: var(--amber); border-color: var(--amber); color: var(--ink); }

  /* ---------- lista de funciones ---------- */
  .grupo-tit { font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: 1.4px; text-transform: uppercase; color: var(--muted); margin: 6px 4px 0; }
  .funciones { display: grid; gap: 10px; }
  .fun { background: var(--card); border-radius: 18px; box-shadow: var(--sh); border: 2px solid transparent; transition: border-color .2s; overflow: hidden; }
  .fun.activa { border-color: var(--amber); }
  .fun-cab { width: 100%; border: 0; background: none; text-align: left; padding: 14px 16px; display: flex; gap: 12px; align-items: center; }
  .fun-cab .hx { width: 42px; height: 42px; clip-path: var(--hex); background: var(--ink); color: var(--amber); display: grid; place-items: center; flex: none; }
  .fun-cab .hx svg { width: 21px; height: 21px; }
  .fun-cab b { display: block; font-size: 16.5px; }
  .fun-cab small { display: block; color: var(--muted); font-size: 13.5px; }
  .fun-cab .play { margin-left: auto; flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--amber-soft); color: var(--amber-dark); display: grid; place-items: center; }
  .fun-cab .play svg { width: 15px; height: 15px; }
  .fun.activa .play { background: var(--amber); color: var(--ink); }
  .pasos { display: none; list-style: none; margin: 0; padding: 0 16px 16px 70px; counter-reset: p; }
  .fun.activa .pasos { display: block; }
  .pasos li { position: relative; padding: 6px 0 6px 0; font-size: 15px; color: var(--text-2); counter-increment: p; transition: color .2s; }
  .pasos li::before { content: counter(p); position: absolute; left: -30px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--line-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 700; transition: background .2s, color .2s; }
  .pasos li.ahora { color: var(--text); font-weight: 600; } .pasos li.ahora::before { background: var(--amber); color: var(--ink); }
  .pasos li.hecho::before { background: var(--ok); color: #fff; content: "✓"; }
  .k { display: inline-block; font-family: var(--cond); font-weight: 700; font-size: 13px; letter-spacing: .4px; background: var(--ink); color: #fff; border-radius: 6px; padding: 1px 7px; margin: 0 1px; }
  .k.num { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .nota { margin: 0 16px 14px 70px; padding: 9px 12px; border-radius: 10px; background: var(--amber-soft); color: #5C4000; font-size: 13.5px; display: none; }
  .fun.activa .nota { display: block; }
  .problemas { display: none; margin: 0 16px 16px 70px; grid-template-columns: 1fr; gap: 6px; }
  .fun.activa .problemas { display: grid; }
  .problemas div { display: flex; gap: 10px; align-items: center; font-size: 14px; background: var(--paper); border-radius: 10px; padding: 6px 10px; }
  .intro-fun { display: none; margin: 0 16px 10px 70px; padding: 10px 12px; border-radius: 12px; background: var(--paper); color: var(--text-2); font-size: 14.5px; line-height: 1.5; border-left: 3px solid var(--amber); }
  .fun.activa .intro-fun { display: block; }
  .problemas span small { display: block; color: var(--muted); font-size: 12.5px; }
  .problemas b.larga { width: auto; clip-path: none; border-radius: 6px; padding: 0 6px; font-size: 11px; }
  .problemas b { font-family: var(--cond); font-size: 15px; width: 26px; height: 26px; clip-path: var(--hex); background: var(--ink); color: var(--amber); display: grid; place-items: center; flex: none; }
  .aviso { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: var(--sh); display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; color: var(--text-2); }
  .aviso svg { width: 22px; height: 22px; color: var(--amber-dark); flex: none; margin-top: 2px; }
  .ayuda-sat { background: var(--ink); color: #fff; border-radius: 18px; padding: 16px; display: flex; gap: 14px; align-items: center; }
  .ayuda-sat img { height: 26px; } .ayuda-sat b { display: block; } .ayuda-sat small { color: #B9B6AC; }
  .ayuda-sat a { margin-left: auto; background: #1FA855; color: #fff; text-decoration: none; font-weight: 700; padding: 9px 14px; border-radius: 12px; font-size: 14px; white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { *, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="barra"><div class="barra-in"><img src="/icons/logo.png" alt="SAT"><span class="sep"></span><span class="sec">Guía de uso</span></div></header>
<section class="hero"><div class="hero-in">
  <div class="selector marca" role="tablist"><button class="on" data-marca="paradox" role="tab">Paradox</button><button data-marca="dsc" role="tab">DSC</button><button data-marca="ajax" role="tab">Ajax</button></div>
  <span class="eyebrow" id="eyeMarca">Alarma Paradox</span>
  <h1>Usá tu alarma <em>sin vueltas</em></h1>
  <p>Elegí tu teclado y tocá una función: el teclado te muestra qué tocar, paso por paso.</p>
  <div class="selector" id="selTec" role="tablist"></div>
</div></section>

<main class="cuerpo">
  <section class="visor" aria-label="Animación del teclado">
    <div class="visor-tit"><b id="vTit">Activar la alarma</b><small id="vTec">Teclado K32 LCD</small></div>
    <div class="tk-wrap" id="tkWrap">
    <div id="tecK10" hidden><svg class="k10h" viewBox="0 0 560 346" role="img" aria-label="Teclado Paradox K10H"><defs>
<linearGradient id="hCuerpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F7F5"/><stop offset="1" stop-color="#E9E9E5"/></linearGradient>
<linearGradient id="hTecla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1F2F0"/><stop offset="1" stop-color="#D9DAD6"/></linearGradient>
<radialGradient id="hRojo" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#FFF1F1"/><stop offset=".35" stop-color="#FF6B78"/><stop offset="1" stop-color="#E0283C"/></radialGradient>

    $$(".rled").forEach((l) => l.classList.remove("v", "r", "a", "tit"));
    dscLuces({ listo: 1, armado: 0, sistema: 0 });
    pkSet({ d: "11:30", w: [], n: [], tri: 0 }); $("#pkCA").classList.add("on");
    cmbSet({ led: null, fallo: 0, marco: 0, lector: 0 });
    tsSet({ scr: "sleep", est: "Desarmado", tsLogo: 0, fallo: 0, badge: 0, dots: 0 });
  }
  // Ajax KeyPad Combi: indicadores (armado, desarmado, noche, fallo), marco de luz de la sirena y lector.
  function cmbSet(c) {
    if ("led" in c) ["Arm", "Des", "Noche"].forEach((k) => $("#cmb" + k).classList.toggle("on", c.led === k.toLowerCase()));
    if ("fallo" in c) $("#cmbFallo").classList.toggle("on", !!c.fallo);
    if ("marco" in c) { const m = $("#cmbMarco"); m.classList.toggle("on", c.marco === 1); m.classList.toggle("alarma", c.marco === "alarma"); }
    if ("lector" in c) $("#cmbLector").classList.toggle("on", !!c.lector);
  }
  // Ajax KeyPad TouchScreen: pantalla visible, estado, logo, aviso de fallo, sobre de eventos y puntos del código.
  function tsSet(t) {
    if (t.scr) $$("#tecTS .tsscr").forEach((g) => g.classList.toggle("on", g.dataset.scr === t.scr));
    if (t.est) {
      $("#tsEstado").textContent = t.est;
      const col = { Armado: "#E53940", Desarmado: "#2BB24C", "Modo noche": "#3D6FE0" }[t.est];
      $("#tsAro").setAttribute("stroke", col);
      $("#tsIcoArm").setAttribute("opacity", t.est === "Armado" ? 1 : 0);
      $("#tsIcoDes").setAttribute("opacity", t.est === "Desarmado" ? 1 : 0);
      $("#tsIcoNoche").setAttribute("opacity", t.est === "Modo noche" ? 1 : 0);
    }
    if ("tsLogo" in t) $("#tsLogo").classList.toggle("on", !!t.tsLogo);
    if ("fallo" in t) $("#tsFallo").setAttribute("opacity", t.fallo ? 1 : 0);
    if ("badge" in t) $("#tsBadge").setAttribute("opacity", t.badge ? 1 : 0);
    if ("dots" in t) $$("#tecTS .tsdot").forEach((d, i) => d.classList.toggle("on", i < t.dots));
  }
  // DSC: luces Listo (verde), Armado (rojo) y Sistema (ámbar). En la PK5501: tilde y candado.
  function dscLuces(l) {
    const set = (id, v, c) => { const e = $(id); e.classList.remove("v", "r", "a", "tit"); if (v) { e.classList.add(c); if (v === "tit") e.classList.add("tit"); } };
    if ("listo" in l) { set("#rListo", l.listo, "v"); $("#pkOk").classList.toggle("on", !!l.listo); }
    if ("armado" in l) { set("#rArmado", l.armado, "r"); $("#pkLock").classList.toggle("on", !!l.armado); $("#pkLock").classList.toggle("tit", l.armado === "tit"); }
    if ("sistema" in l) set("#rSistema", l.sistema, "a");
  }
  // PK5501: dígitos de 7 segmentos, palabras (MEMORY, BYPASS…) y números de fallo 1 a 8.
  const SEG = { "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc", "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg", " ": "", "-": "g" };
  function digito(x, ch) {
    const on = SEG[ch] || "", s = (k, d) => `<path class="seg${on.includes(k) ? "" : " off"}" d="${d}" transform="translate(${x} 0) skewX(-6)"/>`;
    return s("a", "M3 0h14l-3 4h-8z") + s("b", "M18 1l3 3v12l-3 2l-3-2V4z") + s("c", "M18 20l3 2v12l-3 3l-3-3V22z") + s("d", "M3 38h14l-3-4h-8z") + s("e", "M2 20l3 2v12l-3 3l-3-3V22z").replace("translate(", "translate(") + s("f", "M2 1l3 3v12l-3 2l-3-2V4z") + s("g", "M4 19l2-2h8l2 2l-2 2h-8z");
  }
  function pkSet(p) {
    if (p.d !== undefined) {
      const txt = p.d.includes(":") ? p.d.replace(":", "") : p.d.padStart(4, " ");
      let h = ""; [0, 1, 2, 3].forEach((i) => { h += digito(i * 28 + (i > 1 ? 12 : 0), txt[i] || " "); });
      if (p.d.includes(":")) h += '<rect class="seg" x="58" y="10" width="4" height="4"/><rect class="seg" x="57" y="24" width="4" height="4"/>';
      $("#pkDig").innerHTML = h;
    }
    if (p.w) $$("#pkIco .pkw[data-w]").forEach((e) => e.classList.toggle("on", p.w.includes(e.dataset.w)));
    if (p.n) $$("#pkIco .pkw[data-n]").forEach((e) => e.classList.toggle("on", p.n.includes(+e.dataset.n)));
    if (p.tri !== undefined) $("#pkTri").classList.toggle("on", !!p.tri);
  }
  // Luces del área 1 del K10H: ARM, NOCHE, EN CASA (rojas) u OFF (verde). "-tit" = titilando.
  function area(v) {
    const [nom, tit] = v.split("-");
    ["ARM", "NOCHE", "ENCASA", "OFF"].forEach((k) => { const l = $("#a1" + k); l.classList.remove("rojo", "verdeL", "tit"); if (k === nom) { l.classList.add(k === "OFF" ? "verdeL" : "rojo"); if (tit) l.classList.add("tit"); } });
  }
  function lcd(l) { if (!l) return; $("#kL1").textContent = l[0] || ""; $("#kL2").textContent = l[1] || ""; }
  function aplicarEstado(p) {
    if (p.zonas) Object.entries(p.zonas).forEach(([n, v]) => { const t = $(`#tecK10 .tecla[data-zona="${n}"]`); if (t) { t.classList.toggle("z-on", v === "on"); t.classList.toggle("z-flash", v === "flash"); } });
    if (p.fn) Object.entries(p.fn).forEach(([k, v]) => { const t = $(`#tecK10 .tecla[data-k="${k}"]`); if (t) { t.classList.toggle("f-on", v === "on"); t.classList.toggle("f-flash", v === "flash"); } });
    if (p.area) area(p.area);
    if (p.zonas) Object.entries(p.zonas).forEach(([n, v]) => { const e = $("#rZ" + n); if (e) { e.classList.remove("r", "tit"); if (v) { e.classList.add("r"); if (v === "flash") e.classList.add("tit"); } } });
    if (p.luces) dscLuces(p.luces);
    if (p.pk) pkSet(p.pk);
    if (p.cmb) cmbSet(p.cmb);
    if (p.ts) tsSet({ ...p.ts, ...("tsLogo" in p ? { tsLogo: p.tsLogo } : {}) });
    else if ("tsLogo" in p) tsSet({ tsLogo: p.tsLogo });
  }
  async function apretar(k, ms = 260) {
    const t = tecla(k); if (!t) return;
    const d = $("#dedo"), r = t.getBoundingClientRect(), c = $("#tkWrap").getBoundingClientRect();
    d.style.left = (r.left - c.left + r.width / 2 - 17) + "px"; d.style.top = (r.top - c.top + r.height / 2 - 17) + "px"; d.style.opacity = 1;
    await espera(320); t.classList.add("apretada"); await espera(ms); t.classList.remove("apretada"); await espera(120);
  }
  async function correrPaso(f, i) {
    const p = PASOS(f)[i];
    $("#sNum").textContent = i + 1; $("#sTxt").innerHTML = p.t;
    $$(`.fun[data-id="${f.id}"] .pasos li`).forEach((li, k) => { li.classList.toggle("ahora", k === i); li.classList.toggle("hecho", k < i); });
    $("#bip").classList.remove("on");
    if (p.antes) aplicarEstado(p.antes);
    if (p.tecla) await apretar(p.tecla);
    if (p.teclas) for (const k of p.teclas) await apretar(k, 200);
    if (p.codigo) {
      const cod = typeof p.codigo === "string" ? p.codigo : CODIGO; let txt = "";
      for (const ch of cod) { await apretar(ch, 160); txt += "*"; lcd(["Código:", txt]); tsSet({ dots: txt.length }); }
    }
    if (p.sostener) {
      const ks = [].concat(p.sostener);
      await apretar(ks[0], 10);
      ks.forEach((k) => { tecla(k).classList.add("apretada", "sostener"); });
      await espera(1600);
      ks.forEach((k) => tecla(k).classList.remove("apretada", "sostener"));
    }
    $("#dedo").style.opacity = 0;
    aplicarEstado(p); lcd(p.lcd);
    if (p.bip) { $("#bip").classList.add("on"); }
  }
  async function reproducir(desde = 0) {
    limpiar(); const f = actual; if (!f) return;
    estadoBase(); paso = desde;
    // Si arrancamos a mitad, se aplican los estados de los pasos anteriores sin animar.
    for (let i = 0; i < desde; i++) { aplicarEstado(PASOS(f)[i]); lcd(PASOS(f)[i].lcd); }
    for (let i = desde; i < PASOS(f).length; i++) {
      if (actual !== f) return;
      paso = i; await correrPaso(f, i); await espera(1500);
    }
    $$(`.fun[data-id="${f.id}"] .pasos li`).forEach((li) => { li.classList.remove("ahora"); li.classList.add("hecho"); });
    await espera(2200);
    if (actual === f && auto) reproducir(0);
  }
  function elegir(id) {
    actual = FUNCIONES.find((f) => f.id === id);
    $$(".fun").forEach((el) => el.classList.toggle("activa", el.dataset.id === id));
    $("#vTit").textContent = actual.tit;
    reproducir(0);
  }
  function setTipo(t) {
    tipo = t;
    $$("#selTec button").forEach((b) => b.classList.toggle("on", b.dataset.teclado === t));
    Object.entries(CONT).forEach(([k, sel]) => { $(sel).hidden = k !== t; });
    $("#vTec").textContent = MARCAS[marca].teclados.find((x) => x[0] === t)[2];
    if (actual) { renderLista(); $$(".fun").forEach((el) => el.classList.toggle("activa", el.dataset.id === actual.id)); reproducir(0); }
  }
  function setMarca(m, t, f) {
    marca = m; FUNCIONES = MARCAS[m].fun;
    $$("[data-marca]").forEach((b) => b.classList.toggle("on", b.dataset.marca === m));
    $("#eyeMarca").textContent = "Alarma " + MARCAS[m].nombre;
    $("#selTec").innerHTML = MARCAS[m].teclados.map(([k, n]) => `<button data-teclado="${k}" role="tab">${n}</button>`).join("");
    const previo = actual && actual.id; actual = null;
    tipo = t && MARCAS[m].teclados.some((x) => x[0] === t) ? t : MARCAS[m].teclados[0][0];
    renderLista();
    setTipo(tipo);
    elegir(FUNCIONES.some((x) => x.id === (f || previo)) ? (f || previo) : "arm");
  }
  document.addEventListener("click", (e) => {
    const m = e.target.closest("[data-marca]"); if (m) return setMarca(m.dataset.marca);
    const s = e.target.closest("[data-teclado]"); if (s) return setTipo(s.dataset.teclado);
    const f = e.target.closest(".fun-cab"); if (f) { const id = f.parentNode.dataset.id; if (actual && actual.id === id) reproducir(0); else elegir(id); if (innerWidth < 900) $(".visor").scrollIntoView({ behavior: "smooth", block: "start" }); }
  });
  $("#bPlay").onclick = () => reproducir(0);
  $("#bSig").onclick = () => { if (actual) reproducir(Math.min(PASOS(actual).length - 1, paso + 1)); };
  $("#bAnt").onclick = () => { if (actual) reproducir(Math.max(0, paso - 1)); };
  const p = new URLSearchParams(location.search);
  setMarca(MARCAS[p.get("marca")] ? p.get("marca") : "paradox", p.get("teclado"), p.get("f"));
</script>
</body>
